name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -euo pipefail
            cd /var/www/hitshop

            git fetch origin master
            git reset --hard origin/master
            git log -1 --oneline

            cd server
            npm install

            cd ../client
            npm install
            npm run build
            test -f dist/index.html
            ls -la dist/index.html
            echo "CLIENT_BUILD_OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            cd ../server
            pm2 restart hitshop-api
